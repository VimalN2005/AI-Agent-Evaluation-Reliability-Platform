<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Evaluation Engine Prominent Glow & Gradient -->
    <linearGradient id="engineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="engineBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowEngine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8b5cf6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="900" />
    <line x1="300" y1="0" x2="300" y2="900" />
    <line x1="500" y1="0" x2="500" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1100" y1="0" x2="1100" y2="900" />
    <line x1="1300" y1="0" x2="1300" y2="900" />
    <line x1="1500" y1="0" x2="1500" y2="900" />
    <line x1="0" y1="100" x2="1600" y2="100" />
    <line x1="0" y1="300" x2="1600" y2="300" />
    <line x1="0" y1="500" x2="1600" y2="500" />
    <line x1="0" y1="700" x2="1600" y2="700" />
  </g>

  <!-- Header Section -->
  <g text-anchor="middle">
    <text x="800" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="1.5">AI AGENT EVALUATION &amp; RELIABILITY PLATFORM</text>
    <text x="800" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">End-to-End Evaluation, Trace Collection &amp; Performance Benchmarking Architecture</text>
  </g>

  <!-- ==================== FLOW 1: USER / CLIENT REQUEST ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="610" y="85" width="380" height="42" rx="8" fill="#131d2e" stroke="#2563eb" stroke-width="1.5" />
    <text x="800" y="111" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">
      1. User / Client Request
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="800" y1="127" x2="800" y2="150" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== FLOW 2: AI AGENT UNDER TEST ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="610" y="152" width="380" height="42" rx="8" fill="#172236" stroke="#3b82f6" stroke-width="1.5" />
    <text x="800" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#60a5fa">
      2. AI Agent Under Test
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="800" y1="194" x2="800" y2="217" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

