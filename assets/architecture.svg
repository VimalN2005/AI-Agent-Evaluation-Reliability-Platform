  <!-- ==================== 5 BRANCHING ARROWS ==================== -->
  <!-- Branch 1 -> Correctness (x=210) -->
  <path d="M 660 429 L 660 455 L 210 455 L 210 478" fill="none" stroke="#60a5fa" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Branch 2 -> Faithfulness (x=505) -->
  <path d="M 730 429 L 730 455 L 505 455 L 505 478" fill="none" stroke="#60a5fa" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Branch 3 -> RAG Quality (x=800) -->
  <path d="M 800 429 L 800 478" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Branch 4 -> Tool-Call (x=1095) -->
  <path d="M 870 429 L 870 455 L 1095 455 L 1095 478" fill="none" stroke="#60a5fa" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- Branch 5 -> Cost & Latency (x=1390) -->
  <path d="M 940 429 L 940 455 L 1390 455 L 1390 478" fill="none" stroke="#60a5fa" stroke-width="1.75" marker-end="url(#arrow)" />

