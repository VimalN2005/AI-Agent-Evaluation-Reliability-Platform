    </text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="800" y1="678" x2="800" y2="702" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== FLOW 7: STREAMLIT ANALYTICS DASHBOARD ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="610" y="704" width="380" height="50" rx="8" fill="#1e1e38" stroke="#ff4b4b" stroke-width="1.5" />
    <!-- Streamlit Crown/Logo indicator -->
    <text x="635" y="734" font-family="sans-serif" font-size="18" fill="#ff4b4b">👑</text>
    <text x="800" y="726" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">
