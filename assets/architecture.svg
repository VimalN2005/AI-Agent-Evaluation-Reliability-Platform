    </text>
    <text x="800" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#38bdf8">
      sdk/client.py
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="800" y1="265" x2="800" y2="288" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== FLOW 4: SQLITE TRACE DATABASE ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="610" y="290" width="380" height="46" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <!-- Database cylinder icon graphic -->
    <path d="M 630 306 C 630 303 638 301 646 301 C 654 301 662 303 662 306 L 662 320 C 662 323 654 325 646 325 C 638 325 630 323 630 320 Z" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <ellipse cx="646" cy="306" rx="16" ry="4" fill="#334155" stroke="#94a3b8" stroke-width="1.2" />
    <text x="800" y="311" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">
