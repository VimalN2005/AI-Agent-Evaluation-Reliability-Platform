    <rect x="375" y="482" width="260" height="26" rx="8" fill="#064e3b" opacity="0.4" />
    <text x="505" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">Faithfulness Evaluator</text>
    <text x="505" y="528" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">(groundedness / hallucination)</text>
    <text x="505" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Context Grounding Verification</text>
  </g>

