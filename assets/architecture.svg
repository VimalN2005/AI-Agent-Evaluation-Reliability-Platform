  <g filter="url(#glowEngine)">
    <rect x="520" y="363" width="560" height="66" rx="12" fill="url(#engineGrad)" stroke="url(#engineBorder)" stroke-width="2.5" />
    <text x="800" y="392" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      5. EVALUATION ENGINE
    </text>
    <text x="800" y="414" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#c084fc">
