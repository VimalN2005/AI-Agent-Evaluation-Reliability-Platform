  <!-- Module 1: Correctness Evaluator -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="482" width="260" height="92" rx="8" fill="#131d2e" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="80" y="482" width="260" height="26" rx="8" fill="#1e3a8a" opacity="0.4" />
    <text x="210" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">Correctness Evaluator</text>
    <text x="210" y="528" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">(answer / logic matching)</text>
    <text x="210" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">LLM-as-Judge &amp; Exact Logic</text>
  </g>

