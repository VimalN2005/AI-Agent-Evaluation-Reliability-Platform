    <ellipse cx="640" cy="654" rx="14" ry="4" fill="#334155" stroke="#38bdf8" stroke-width="1.2" />
    <path d="M 626 654 L 626 664 C 626 667 632 669 640 669 C 648 669 654 667 654 664 L 654 654" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    <text x="800" y="652" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">
