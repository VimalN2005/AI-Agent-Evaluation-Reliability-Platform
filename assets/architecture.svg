    </text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="800" y1="754" x2="800" y2="779" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ==================== FLOW 8: COMPARE RUNS & REGRESSION ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="560" y="781" width="480" height="52" rx="8" fill="#13241b" stroke="#10b981" stroke-width="1.75" />
    <text x="800" y="803" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399">
      8. Compare Runs &amp; Regression
    </text>
    <text x="800" y="822" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#e2e8f0">
