  <g filter="url(#cardShadow)">
    <rect x="670" y="482" width="260" height="92" rx="8" fill="#10232e" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="670" y="482" width="260" height="26" rx="8" fill="#083344" opacity="0.4" />
    <text x="800" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">RAG Precision &amp; Recall</text>
    <text x="800" y="528" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">(retrieval quality)</text>
    <text x="800" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Chunk Relevance &amp; Ranking</text>
  </g>

  <!-- Module 4: Tool-Call Accuracy -->
  <g filter="url(#cardShadow)">
    <rect x="965" y="482" width="260" height="92" rx="8" fill="#291c13" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="965" y="482" width="260" height="26" rx="8" fill="#451a03" opacity="0.4" />
    <text x="1095" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Tool-Call Accuracy</text>
    <text x="1095" y="528" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">(function calling correctness)</text>
    <text x="1095" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Schema &amp; Argument Match</text>
  </g>

  <!-- Module 5: Cost & Latency Analyzer -->
  <g filter="url(#cardShadow)">
    <rect x="1260" y="482" width="260" height="92" rx="8" fill="#21152b" stroke="#a855f7" stroke-width="1.5" />
    <rect x="1260" y="482" width="260" height="26" rx="8" fill="#3b0764" opacity="0.4" />
    <text x="1390" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">Cost &amp; Latency Analyzer</text>
    <text x="1390" y="528" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">(performance / efficiency)</text>
    <text x="1390" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Tokens, Execution Time &amp; Cost</text>
  </g>

  <!-- ==================== 5 CONVERGING ARROWS TO DB ==================== -->
  <path d="M 210 574 L 210 605 L 660 605 L 660 628" fill="none" stroke="#60a5fa" stroke-width="1.75" marker-end="url(#arrow)" />
  <path d="M 505 574 L 505 605 L 730 605 L 730 628" fill="none" stroke="#10b981" stroke-width="1.75" marker-end="url(#arrow)" />
  <path d="M 800 574 L 800 628" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 1095 574 L 1095 605 L 870 605 L 870 628" fill="none" stroke="#f59e0b" stroke-width="1.75" marker-end="url(#arrow)" />
  <path d="M 1390 574 L 1390 605 L 940 605 L 940 628" fill="none" stroke="#a855f7" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- ==================== FLOW 6: EVALUATIONS DATABASE ==================== -->
  <g filter="url(#cardShadow)">
