  <!-- Sub-caption / Footer branding -->
  <g text-anchor="middle" opacity="0.6">
    <text x="800" y="875" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
